{% extends 'base.html' %}{% block body %}<section class="panel"><h2>Create backup</h2><p>Creates a ZIP with the SQLite database and local product images.</p><form method="post"><button>Create backup ZIP</button></form></section><section class="panel"><h2>Restore a backup</h2><p>This replaces current records. The app first creates a safety copy of the current data. Stop other app instances before restoring.</p><form method="post" action="/restore" enctype="multipart/form-data" onsubmit="return confirm('Replace the current database and images with this backup? A safety backup will be saved first.')"><label>Backup ZIP <input type="file" name="backupfile" accept=".zip" required></label><button>Restore backup</button></form></section>{% endblock %}
