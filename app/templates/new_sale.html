{% extends 'base.html' %}{% block body %}<section class="panel"><form method="post" id="sale-form"><div class="formgrid"><label>Customer<select name="customer_id"><option value="">Guest / walk-in</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}} · {{c.phone or ''}}</option>{% endfor %}</select></label><label>Guest name<input name="guest_name"></label><label>Phone<input name="phone"></label><label>Address<input name="address"></label></div><h3>Order items</h3><div id="lines"><div class="formgrid line"><label>Product<select name="product_id[]" required>{% for p in products %}<option value="{{p.id}}" data-price="{{p.price}}">{{p.name}} · &#2547;{{p.price}} · stock {{p.stock}}</option>{% endfor %}</select></label><label>Quantity<input type="number" name="quantity[]" value="1" min="1" required></label><label>Unit selling price<input type="number" name="unit_price[]" value="{{products[0].price if products else 0}}" min="0" step=".01" required></label></div></div><button type="button" id="add-line">Add another item</button><div class="formgrid"><label>Discount<input type="number" name="discount" value="0" min="0" step=".01"></label><label>Amount paid<input type="number" name="paid" value="0" min="0" step=".01"></label><label>Payment method<select name="method">{% for m in ['Cash','bKash','Nagad','Bank','Card','Other'] %}<option>{{m}}</option>{% endfor %}</select></label><label>Notes<input name="notes"></label></div><p><button>Save sale</button></p></form><p class="muted">Available stock is checked transactionally. The selling price and cost are snapshotted at sale time.</p></section><script>
function syncPrice(sel){sel.closest('.line').querySelector('[name="unit_price[]"]').value=sel.selectedOptions[0].dataset.price}document.getElementById('lines').addEventListener('change',e=>{if(e.target.matches('[name="product_id[]"]'))syncPrice(e.target)});document.getElementById('add-line').addEventListener('click',()=>{const row=document.querySelector('.line').cloneNode(true);row.querySelector('[name="quantity[]"]').value=1;document.getElementById('lines').append(row)});
</script>{% endblock %}
