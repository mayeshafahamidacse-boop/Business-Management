{% extends 'base.html' %}{% block body %}<section class="panel"><h2>Add customer</h2><form method="post" class="formgrid"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label><label>Address<input name="address"></label><label>Notes<input name="notes"></label><button>Save customer</button></form></section><section class="panel"><h2>Customers</h2><form method="get"><input name="q" value="{{q}}" placeholder="Search name or phone"><button>Search</button></form><table><tr><th>Name</th><th>Phone</th><th>Address</th><th>Total spend</th><th>Balance</th><th></th></tr>{% for c in customers %}<tr><td><a href="/customers/{{c.id}}">{{c.name}}</a></td><td>{{c.phone}}</td><td>{{c.address}}</td><td>&#2547;{{c.spent}}</td><td>&#2547;{{c.balance}}</td><td><a href="/customers/{{c.id}}/edit">Edit</a></td></tr>{% else %}<tr><td colspan="6">No customers</td></tr>{% endfor %}</table></section>{% endblock %}
