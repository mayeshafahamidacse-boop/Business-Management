{% extends 'base.html' %}{% block body %}<section class="panel"><form method="post" enctype="multipart/form-data" class="formgrid"><label>Name<input name="name" value="{{product.name}}" required></label><label>Category<select name="category">{% for c in ['Clothing','Hair Clips','Accessories','Jewelry','Ornaments','Other'] %}<option {% if c==product.category %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>SKU<input name="sku" value="{{product.sku or ''}}"></label><label>Cost<input name="cost" type="number" min="0" step=".01" value="{{product.cost}}"></label><label>Price<input name="price" type="number" min="0" step=".01" value="{{product.price}}"></label><label>Stock<input name="stock" type="number" min="0" value="{{product.stock}}"></label><label>Low stock threshold<input name="threshold" type="number" min="0" value="{{product.threshold}}"></label><label>Photo<input type="file" name="photo" accept="image/*"></label><label>Description<input name="description" value="{{product.description or ''}}"></label><button>Save changes</button></form></section>{% endblock %}
