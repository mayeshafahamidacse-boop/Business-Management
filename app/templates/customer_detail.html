{% extends 'base.html' %}{% block body %}<section class="panel"><h2>{{customer.name}}</h2><p>{{customer.phone}} · {{customer.address}}</p><a class="button" href="/customers/{{customer.id}}/edit">Edit customer</a><h3>Purchase history</h3><table><tr><th>Sale</th><th>Date</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr>{% for s in sales %}<tr><td><a href="/sales/{{s.id}}">#{{s.id}}</a></td><td>{{s.created_at}}</td><td>&#2547;{{s.total}}</td><td>&#2547;{{s.paid}}</td><td>&#2547;{{s.total-s.paid}}</td><td>{{s.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
