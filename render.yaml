services:
  - type: web
    name: pinteresty-outfits-business-desk
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: /var/data
      - key: APP_AUTH_REQUIRED
        value: "true"
      - key: BOUTIQUE_SECRET
        generateValue: true
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
    disk:
      name: boutique-data
      mountPath: /var/data
      sizeGB: 1
